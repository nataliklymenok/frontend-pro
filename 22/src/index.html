<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="weather-card">
      <div class="left">
        <div class="date"></div>

        <div class="meta">
          <span></span>
        </div>

        <div class="time"><span></span></div>

        <div class="details">
          <p id="humidity"></p>
          <p id="pressure"></p>
          <p id="wind"></p>
        </div>
      </div>

      <div class="right">
        <div class="icon"></div>

        <div class="temp"></div>
        <div class="feels"></div>
        <div class="condition"></div>

        <div class="updated">
          <span id="updated"></span>
          <button id="refresh">🔄</button>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js" defer></script>
</html>
